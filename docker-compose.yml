version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-agent-research-assistant:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MAX_CONCURRENT_REQUESTS=50
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
