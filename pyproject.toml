[project]
name = "multi-agent-research-assistant"
version = "1.0.0"
description = "Multi-Agent AI Research Assistant"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Benchmark dataset generator: long lines are data literals (topic tuples
# with keyphrase lists), intentionally kept one-per-line for reviewability.
"app/evaluation/generate_benchmark.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
