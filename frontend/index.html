<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScholarAgent • Autonomous AI Research Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Universal scrollbar suppression - eliminates all OS scrollbars, tracks, thumbs, and arrow buttons */
      html, body, *, *::before, *::after {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track,
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-button,
      *::-webkit-scrollbar-button,
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
      /* Theme-aware styling for Mathematical Formula Cards, Visual Architecture Diagrams & Markdown Tables */
      .prose pre {
        background: linear-gradient(145deg, rgba(15, 20, 36, 0.94), rgba(28, 25, 68, 0.78)) !important;
        border: 1px solid rgba(129, 140, 248, 0.3) !important;
        border-left: 3px solid #818cf8 !important;
        border-radius: 12px !important;
        padding: 16px 20px !important;
        margin: 14px 0 !important;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.87rem !important;
        line-height: 1.6 !important;
        color: #e0e7ff !important;
        overflow-x: auto !important;
        box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.38) !important;
      }
      [data-theme='light'] .prose pre {
        background: linear-gradient(145deg, #f5f7ff, #eef2ff) !important;
        border: 1px solid rgba(79, 70, 229, 0.22) !important;
        border-left: 3px solid #4f46e5 !important;
        color: #1e1b4b !important;
        box-shadow: 0 6px 18px -6px rgba(79, 70, 229, 0.12) !important;
      }
      .prose code {
        font-family: 'JetBrains Mono', monospace !important;
        color: #c7d2fe !important;
        background: rgba(99, 102, 241, 0.14) !important;
        padding: 2px 6px !important;
        border-radius: 5px !important;
      }
      [data-theme='light'] .prose code {
        color: #3730a3 !important;
        background: rgba(79, 70, 229, 0.1) !important;
      }
      .prose pre code {
        background: transparent !important;
        padding: 0 !important;
        color: inherit !important;
      }
      .prose table {
        display: table !important;
        width: 100% !important;
        max-width: 100% !important;
        border-collapse: collapse !important;
        table-layout: auto !important;
        margin: 18px 0 !important;
        overflow-wrap: normal !important;
        word-break: normal !important;
        border: 1px solid rgba(129, 140, 248, 0.22) !important;
        border-radius: 10px !important;
      }
      .prose thead th,
      .prose th {
        background: rgba(24, 30, 50, 0.92) !important;
        color: #e0e7ff !important;
        font-weight: 600 !important;
        font-size: 0.84rem !important;
        padding: 11px 14px !important;
        border: 1px solid rgba(129, 140, 248, 0.2) !important;
        white-space: normal !important;
        overflow-wrap: normal !important;
        word-break: normal !important;
        hyphens: none !important;
        vertical-align: top !important;
        min-width: 110px !important;
      }
      [data-theme='light'] .prose thead th,
      [data-theme='light'] .prose th {
        background: #eef2ff !important;
        color: #1e293b !important;
        border: 1px solid rgba(79, 70, 229, 0.18) !important;
      }
      .prose tbody td,
      .prose td {
        padding: 11px 14px !important;
        border: 1px solid rgba(129, 140, 248, 0.14) !important;
        vertical-align: top !important;
        overflow-wrap: normal !important;
        word-break: normal !important;
        hyphens: none !important;
        min-width: 120px !important;
        max-width: 340px !important;
        line-height: 1.6 !important;
      }
      [data-theme='light'] .prose tbody td,
      [data-theme='light'] .prose td {
        border: 1px solid rgba(15, 23, 42, 0.1) !important;
      }
      .prose tbody tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.025) !important;
      }
      [data-theme='light'] .prose tbody tr:nth-child(even) td {
        background: rgba(79, 70, 229, 0.03) !important;
      }
      .prose th:first-child,
      .prose td:first-child {
        min-width: 44px !important;
        max-width: 90px !important;
        width: auto !important;
        white-space: nowrap !important;
      }
      .prose td code {
        display: inline !important;
        white-space: pre-wrap !important;
        word-break: normal !important;
        overflow-wrap: break-word !important;
        line-height: 1.55 !important;
      }
      .prose td pre {
        margin: 4px 0 !important;
        padding: 8px 10px !important;
        white-space: pre-wrap !important;
        word-break: break-word !important;
      }
    </style>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var qsT = params.get('theme');
          var t = (qsT === 'light' || qsT === 'dark') ? qsT : (localStorage.getItem('research-theme') === 'light' ? 'light' : 'dark');
          document.documentElement.dataset.theme = t;
          var validP = ['aurora', 'emerald', 'amber', 'rose', 'ocean'];
          var qsP = params.get('palette');
          var savedP = localStorage.getItem('research-palette');
          var p = validP.indexOf(qsP) !== -1 ? qsP : (validP.indexOf(savedP) !== -1 ? savedP : 'aurora');
          document.documentElement.dataset.palette = p;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Real-time LaTeX macro cleaner for live streaming tokens inside .prose
      (function() {
        function cleanRawLatexInNode(root) {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          for (const node of nodes) {
            const v = node.nodeValue;
            if (!v || (!v.includes('$$') && !v.includes('\\text') && !v.includes('\\frac') && !v.includes('\\mathbf') && !v.includes('\\qquad'))) continue;
            let s = v
              .replace(/\$\$\s*[,;]\s*\$\$/g, '\n')
              .replace(/\$\$/g, '')
              .replace(/\\\[|\\\]|\\\(|\\\)/g, '')
              .replace(/\\(?:qquad|quad)/g, '  │  ')
              .replace(/\\(?:text|mathrm|mathbf|operatorname|mathcal)\s*\{([^{}]*)\}/g, '$1')
              .replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1) / ($2)')
              .replace(/\\sqrt\s*\{([^{}]+)\}/g, '√($1)')
              .replace(/\\lfloor/g, '⌊').replace(/\\rfloor/g, '⌋')
              .replace(/\\sum/g, '∑').replace(/\\in/g, ' ∈ ')
              .replace(/\\times/g, ' × ').replace(/\\cdot/g, ' · ')
              .replace(/\\mathbb\{R\}/g, 'ℝ').replace(/\\rightarrow|\\to/g, ' → ');
            if (s !== v) node.nodeValue = s;
          }
        }
        const obs = new MutationObserver(() => {
          document.querySelectorAll('.prose').forEach(cleanRawLatexInNode);
        });
        window.addEventListener('DOMContentLoaded', () => {
          obs.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
